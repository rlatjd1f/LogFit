name: Release Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Run Node Tests
        run: npm test

      - name: Build Web Assets & Capacitor Sync
        run: npm run android:sync

      - name: Build Debug APK
        run: |
          chmod +x ./android/gradlew
          ./android/gradlew -p android assembleDebug

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/LogFit-${{ github.ref_name }}.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/LogFit-${{ github.ref_name }}.apk
          name: LogFit ${{ github.ref_name }}
          body: |
            LogFit 모바일 테스트용 APK 자동 빌드 배포입니다.
            스마트폰에서 아래 APK 파일을 다운로드받아 설치해 주세요.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
